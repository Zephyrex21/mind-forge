    <rect x="48" y="184" width="404" height="102" rx="22" fill="#F3F6F1"/><text x="70" y="213" class="u">AI REFLECTION</text><text x="70" y="239" style="font:500 14px 'Public Sans',Arial;fill:#5C6A61">“Your notes point to a calmer day with steady energy.</text><text x="70" y="261" style="font:500 14px 'Public Sans',Arial;fill:#5C6A61">The patterns below come from what you logged, not assumptions.”</text>
