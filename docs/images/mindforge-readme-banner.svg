  <g transform="translate(92 92)"><text x="0" y="0" class="k">DAILY WELLNESS JOURNAL</text><text x="0" y="92" class="t">MindForge</text><text x="0" y="142" class="s">A calm, personal space to check in, reflect, and understand</text><text x="0" y="176" class="s">patterns in your own wellness data.</text>
