name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  frontend:
    name: Frontend (lint, test, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: 'npm'
      - name: Install dependencies
        run: npm install
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm test
      - name: Build
        run: npm run build

  backend:
    name: Backend (lint, test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: server/package-lock.json
      - name: Install dependencies
        run: npm install
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm test

  security-audit:
    name: Security audit (production dependencies)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      # Gated on --omit=dev deliberately: this fails the build only for
      # vulnerabilities in packages that actually ship to users. Vitest's
      # own dev-server toolchain (esbuild/vite) currently has known
      # moderate/high advisories with no non-breaking fix available yet —
      # real, but irrelevant to what's actually deployed, since it never
      # leaves the CI/dev environment. Excluding dev deps here is the
      # standard, deliberate distinction — not a workaround to silence
      # noise. `audit-level=high` catches high/critical; moderate-and-below
      # in production deps are reported but don't fail the build.
      - name: Audit frontend production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Audit backend production dependencies
        working-directory: server
        run: npm audit --omit=dev --audit-level=high

  secret-scan:
    name: Secret scanning (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history, not just the latest commit — a secret committed
          # and later removed is still exploitable by anyone with access
          # to the repo's history, so it needs to be caught too.
          fetch-depth: 0
      # Using the raw gitleaks binary directly rather than the official
      # gitleaks-action wrapper: the wrapper's PR-commenting/reporting
      # features require a paid license for org-owned repos (the core
      # scanner itself is free/open-source either way). This avoids that
      # licensing question entirely while still getting the same scan.
      - name: Install gitleaks
        run: |
          curl -sSL -o gitleaks.tar.gz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          tar -xzf gitleaks.tar.gz gitleaks
      - name: Scan for secrets
        run: ./gitleaks git . -v

  codeql:
    name: CodeQL static analysis
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
      - uses: github/codeql-action/analyze@v3
